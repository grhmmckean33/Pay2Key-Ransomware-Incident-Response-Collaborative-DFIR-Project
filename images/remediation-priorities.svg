<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>.h{font:700 24px Arial;fill:#172033}.t{font:700 20px Arial;fill:white}.s{font:17px Arial;fill:#172033}.a{fill:#8b2e2e}.b{fill:#2457a6}.c{fill:#436b48}.panel{fill:#f5f7fa;stroke:#cad3df;stroke-width:2}</style><text x="55" y="45" class="h">Remediation Priorities from the Client Report</text><rect x="50" y="80" width="340" height="360" rx="14" class="panel"/><rect x="50" y="80" width="340" height="62" rx="14" class="a"/><text x="78" y="120" class="t">Immediate</text><text x="75" y="180" class="s">• Disable internet-facing RDP</text><text x="75" y="220" class="s">• Isolate affected systems</text><text x="75" y="260" class="s">• Reset all passwords</text><text x="75" y="300" class="s">• Rebuild compromised hosts</text><text x="75" y="340" class="s">• Remove unauthorised tools</text><rect x="430" y="80" width="340" height="360" rx="14" class="panel"/><rect x="430" y="80" width="340" height="62" rx="14" class="b"/><text x="458" y="120" class="t">Short term</text><text x="455" y="180" class="s">• Review security alerts</text><text x="455" y="220" class="s">• Hunt for further access</text><text x="455" y="260" class="s">• Restore from clean backups</text><rect x="810" y="80" width="340" height="360" rx="14" class="panel"/><rect x="810" y="80" width="340" height="62" rx="14" class="c"/><text x="838" y="120" class="t">Long term</text><text x="835" y="180" class="s">• Enforce MFA</text><text x="835" y="220" class="s">• Add account lockout</text><text x="835" y="260" class="s">• Monitor and respond to alerts</text><text x="835" y="300" class="s">• Segment systems</text><text x="835" y="340" class="s">• Use named admin accounts</text></svg>