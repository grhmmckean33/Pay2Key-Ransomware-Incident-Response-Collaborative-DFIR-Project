<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><style>.t{font:700 30px Arial;fill:#172033}.h{font:700 24px Arial;fill:#fff}.b{font:18px Arial;fill:#253047}.box{rx:18;stroke:#253047;stroke-width:2}.arrow{stroke:#52627a;stroke-width:5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs><rect width="1200" height="480" fill="#f6f8fb"/><text x="600" y="55" text-anchor="middle" class="t">Three-Check Scope Assessment Method</text><rect x="55" y="130" width="285" height="190" fill="#2457a6" class="box"/><text x="198" y="185" text-anchor="middle" class="h">1. File Presence</text><text x="198" y="230" text-anchor="middle" class="h" style="font-size:18px;font-weight:400">Path • Hash • Creation time</text><rect x="458" y="130" width="285" height="190" fill="#633e98" class="box"/><text x="600" y="185" text-anchor="middle" class="h">2. Process Execution</text><text x="600" y="230" text-anchor="middle" class="h" style="font-size:18px;font-weight:400">Parent • Command line • User</text><rect x="860" y="130" width="285" height="190" fill="#13756d" class="box"/><text x="1002" y="185" text-anchor="middle" class="h">3. Network Activity</text><text x="1002" y="230" text-anchor="middle" class="h" style="font-size:18px;font-weight:400">Remote IP • Port • Process</text><line x1="340" y1="225" x2="450" y2="225" class="arrow"/><line x1="743" y1="225" x2="852" y2="225" class="arrow"/><rect x="365" y="375" width="470" height="70" fill="#fff" class="box"/><text x="600" y="419" text-anchor="middle" class="b" style="font-weight:700">Correlate evidence before assigning scope</text></svg>